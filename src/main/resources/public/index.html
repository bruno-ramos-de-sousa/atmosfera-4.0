<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmosfera 4.0</title>
    <link
      rel="shortcut icon"
      href="assets/nuvem-favicon-96px.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styles/index.css" />
  </head>

  <body class="layout-column">
    <header class="layout-row" id="page-header">
      <span id="sandwich-button" class="layout-column" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </span>
      <h1 id="hero-title">SENAI "Anchieta" - Atmosfera 4.0</h1>
    </header>

    <div class="layout-row" id="app-shell">
      <aside id="sidebar" class="sidebar-collapsed">
        <nav aria-label="Menu lateral">
          <ul class="sidebar-menu layout-column">
            <li class="sidebar-item layout-column">
              <button
                type="button"
                class="sidebar-item-button is-selected"
                onclick="changeScreen('home')"
              >
                <img
                  src="assets/home-icon.png"
                  alt="Home Icon"
                  class="icon"
                />Hoje
              </button>
            </li>

            <li class="sidebar-item layout-column">
              <button
                type="button"
                class="sidebar-item-button"
                onclick="changeScreen('historico')"
              >
                <img
                  src="assets/history-icon.png"
                  alt=""
                  class="icon"
                />Histórico
              </button>
            </li>

            <li class="sidebar-item layout-column">
              <button
                type="button"
                class="sidebar-item-button"
                onclick="changeScreen('mapa')"
              >
                <img
                  src="assets/map-icon.png"
                  alt="Map Icon"
                  class="icon"
                />Mapa do Campus
              </button>
            </li>

            <li class="sidebar-item layout-column">
              <button
                type="button"
                class="sidebar-item-button"
                onclick="changeScreen('sobre')"
              >
                <img
                  src="assets/info-icon.png"
                  alt="Info Icon"
                  class="icon"
                />Sobre
              </button>
            </li>

            <li class="sidebar-item layout-column">
              <button
                type="button"
                class="sidebar-item-button"
                onclick="changeScreen('robo')"
              >
                <img
                  src="assets/robot-icon.png"
                  alt="Robot Icon"
                  class="icon"
                />Robô
              </button>
            </li>
          </ul>
        </nav>
      </aside>
      <main class="content-panel"></main>
    </div>
  </body>
  <script src="scripts/sandwich.js"></script>
  <script src="scripts/sidebar.js"></script>
  <script src="scripts/dailyRegistros.js"></script>
  <script src="scripts/registros.js"></script>
  <script src="scripts/robot.js"></script>
  <script src="scripts/expandButton.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
</html>
