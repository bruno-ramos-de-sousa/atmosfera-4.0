<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmosfera 4.0</title>
    <link
      rel="shortcut icon"
      href="assets/nuvem-favicon-96px.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styles/index.css" />
  </head>

  <body>
    <header class="page-header">
      <span id="sandwich-button" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </span>
      <h1 id="hero-title">SENAI "Anchieta" - Atmosfera 4.0</h1>
    </header>

    <div class="app-shell">
      <aside id="sidebar" class="sidebar-collapsed">
        <nav aria-label="Menu lateral">
          <ul class="sidebar-menu">

            <li class="sidebar-item">
              <button type="button" class="sidebar-item-button" onclick="mudarTela('home')">
                <img src="assets/home-icon.png" alt="" />Hoje
              </button>
            </li>

            <li class="sidebar-item">
              <button type="button" class="sidebar-item-button" onclick="mudarTela('historico')">
                <img src="assets/history-icon.png" alt="" />Histórico
              </button>
            </li>

            <li class="sidebar-item">
              <button type="button" class="sidebar-item-button" onclick="mudarTela('mapa')">
                <img src="assets/map-icon.png" alt="" />Mapa do Campus
              </button>
            </li>

            <li class="sidebar-item">
              <button type="button" class="sidebar-item-button" onclick="mudarTela('sobre')">
                <img src="assets/info-icon.png" alt="" />Sobre
              </button>
            </li>

            <li class="sidebar-item">
              <button type="button" class="sidebar-item-button" onclick="mudarTela('robo')">
                <img src="assets/robot-icon.png" alt="" />Robô
              </button>
            </li>

          </ul>
        </nav>
      </aside>

      <script src="scripts/sandwich.js"></script>

      <main class="content-panel">
        <span id="expand-button"> </span>
      </main>
    </div>
  </body>
  <script src="scripts/index.js"></script>
</html>
