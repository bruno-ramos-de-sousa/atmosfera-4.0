<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Atmosfera 4.0</title>
    <link
      rel="shortcut icon"
      href="../assets/nuvem-favicon-96px.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../styles/dashboard.css" />
  </head>
  <body>
    <header>
      <button id="sandwich-btn"></button>
      <h1>Atmosfera 4.0</h1>
    </header>
    <main id="container-dashboard">
      <article class="card" id="card-temperatura">
        <img src="../assets/nuvem-favicon-32px.png" alt="Nuvem" id="icon-nuvem" />
        <p id="temperatura">32.5°C</p>
      </article>
      <article class="card" id="card-umidade">
        <p id="umidade">65%</p>
      </article>
      <article class="card" id="card-luminosidade">
        <p id="luminosidade">750 lux</p>
      </article>
      <article class="card" id="card-direcao-vento">
        <p id="direcao-vento">Norte</p>
      </article>
      <article class="card" id="card-velocidade-vento">
        <p id="velocidade-vento">12 km/h</p>
      </article>
      <article class="card" id="card-pressao">
        <p id="pressao">1013 hPa</p>
      </article>
      <article class="card" id="card-altitude">
        <p id="altitude">100 m</p>
      </article>
      <div class="card" id="grafico-semanal"></div>
    </main>
  </body>
  <script src=""></script>
</html>
